name: Vérifier la prévisualisation MIZANE

on:
  push:
    branches:
      - feat/stock-integrated-dev
      - feat/lot3-stock-operations-accounting
      - feat/lot4-periodic-inventory-closing
      - feat/lot5-supplier-settlements
      - feat/lot6-supplier-credit-notes-reconciliation
      - feat/lot7-mixed-supplier-invoices
      - feat/lot8-supplier-line-tax-rates
      - feat/lot9-supplier-credit-note-line-allocation
      - feat/lot10-supplier-auto-account-mapping
      - feat/lot11-supplier-purchase-controls
      - feat/lot12-supplier-payment-schedule
      - feat/lot15-strategic-dashboard
      - feat/lot15-profitability-dashboard
      - feat/lot16-financial-forecast
      - feat/lot17-budget-control
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mizane-cloudflare-preview
  cancel-in-progress: true

jobs:
  test-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche de développement
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci || npm install

      - name: Vérifier le code
        run: |
          npm run lint
          npm test

      # Cloudflare Pages est déployé automatiquement par son intégration GitHub sur les branches Preview.
