name: Déployer la prévisualisation MIZANE sur Cloudflare Pages

on:
  push:
    branches:
      - feat/stock-integrated-dev\n      - feat/lot3-stock-operations-accounting
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mizane-cloudflare-preview
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche de développement
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci || npm install

      - name: Vérifier le code
        run: |
          npm run lint
          npm test

      - name: Déployer uniquement sur Cloudflare Pages (prévisualisation)
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 34f4aa815d65717e8f6c894ff6e9e3a4
        run: npx --yes wrangler@3 pages deploy . --project-name=mizane-test-preview --branch=feat-lot3-stock-operations-accounting
