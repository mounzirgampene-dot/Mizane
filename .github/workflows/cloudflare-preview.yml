name: Déployer la prévisualisation MIZANE sur Cloudflare Pages

on:
  push:
    branches:
      - feat/cloud-accounting-dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mizane-cloudflare-preview
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche de développement
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci || npm install

      - name: Vérifier le code
        run: |
          npm run lint
          npm test

      - name: Déployer uniquement sur Cloudflare Pages (prévisualisation)
        if: success()
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=mizane-preview --branch=feat/cloud-accounting-dev
