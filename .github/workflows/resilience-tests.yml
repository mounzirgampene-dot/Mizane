name: Tests de résilience MIZANE

on:
  push:
    branches:
      - feat/resilience-load-hardening
      - feat/stock-integrated-dev
  pull_request:
    branches:
      - main
      - feat/stock-integrated-dev
      - fix/lot1-security-hardening

permissions:
  contents: read

concurrency:
  group: mizane-resilience-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les dépendances
        run: npm ci || npm install
      - name: Vérifier le style et les erreurs
        run: npm run lint
      - name: Exécuter les tests fonctionnels et de résilience
        run: npm test
