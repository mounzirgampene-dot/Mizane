name: Tests de résilience MIZANE

on:
  push:
    branches:
      - feat/resilience-load-hardening
      - feat/stock-integrated-dev
      - fix/lot2-billing-integrity
      - feat/lot3-stock-operations-accounting
      - feat/lot4-periodic-inventory-closing
      - feat/lot5-supplier-settlements
      - feat/lot6-supplier-credit-notes-reconciliation
      - feat/lot7-mixed-supplier-invoices
      - feat/lot8-supplier-line-tax-rates
      - feat/lot9-supplier-credit-note-line-allocation
      - feat/lot10-supplier-auto-account-mapping
  pull_request:
    branches:
      - main
      - feat/stock-integrated-dev
      - fix/lot1-security-hardening
      - fix/lot2-billing-integrity
      - feat/lot4-periodic-inventory-closing
      - feat/lot5-supplier-settlements
      - feat/lot8-supplier-line-tax-rates
      - feat/lot9-supplier-credit-note-line-allocation
      - feat/lot10-supplier-auto-account-mapping

permissions:
  contents: read

concurrency:
  group: mizane-resilience-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Vérifier le style et les erreurs
        run: npm run lint
      - name: Exécuter les tests fonctionnels et de résilience
        run: npm test
